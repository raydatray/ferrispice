[workspace]
members = ["bin/ferrispice", "crates/netlist", "crates/circuit", "crates/mna", "crates/solver"]
default-members = ["bin/ferrispice"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
nalgebra = "0.35"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
